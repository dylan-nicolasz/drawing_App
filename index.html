<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drawing App</title>

    <link rel="stylesheet" href="styles/main.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <h1>🎨 Drawing App</h1>
            <p>Draw, create, and have fun!</p>
        </header>


        <section class="toolbar">

            <div class="tool-group">

                <label for="colorPicker">
                    Color
                </label>

                <input
                    type="color"
                    id="colorPicker"
                    value="#000000"
                >

            </div>


            <div class="tool-group size-control">

                <label for="sizePicker">

                    Brush Size:

                    <span id="sizeValue">
                        5px
                    </span>

                </label>

                <input
                    type="range"
                    id="sizePicker"
                    min="1"
                    max="50"
                    value="5"
                >

            </div>


            <div class="buttons">

                <button id="eraseButton">
                    🧹 Eraser
                </button>

                <button id="undoButton">
                    ↩️ Undo
                </button>

                <button id="clearButton">
                    🗑️ Clear
                </button>

                <button id="saveButton">
                    💾 Save
                </button>

            </div>

        </section>


        <section class="canvas-container">

            <canvas
                id="drawingCanvas"
                width="800"
                height="500">
            </canvas>

        </section>


        <p id="saveMessage"></p>


        <p class="instructions">
            Hold your mouse button and move it across
            the canvas to draw.
        </p>

    </main>


    <script
        type="module"
        src="./dist/main.js">
    </script>

</body>

</html>
